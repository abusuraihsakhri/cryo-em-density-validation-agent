[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cryo-em-density-validation-engine"
version = "2.0.0"
description = "CryoEM-Validator: Fourier Shell Correlation (FSC) & Local Resolution Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cryo-em-density-validation-engine = "cryo_em_validator.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/cryo-em-density-validation-engine"
Repository = "https://github.com/abusuraihsakhri/cryo-em-density-validation-engine.git"
