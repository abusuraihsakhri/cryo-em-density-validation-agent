name: Python and browser validation

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[api,test]"
      - name: Compile Python sources
        run: python -m compileall -q agents cryo_em_validator cli.py simulator.py enrichment.py
      - name: Python regression tests
        run: python -m pytest -q
      - name: Browser script syntax and rule tests
        run: |
          node --check web/app.js
          node --test tests/test_web.cjs
      - name: Exercise CLI
        run: |
          cryo-em-density-validation-agent audit --task-id CI-01 --primary 1 --secondary 1 --status NOMINAL
          cryo-em-density-validation-agent batch -i sample.csv -o results.csv
          cryo-em-density-validation-engine audit --task-id CI-FRONTIER-01 --primary 1 --secondary 1 --status NOMINAL
