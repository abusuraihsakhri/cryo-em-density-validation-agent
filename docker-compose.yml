services:
  cryo-em-density-validation-engine:
    build: .
    container_name: cryo-em-density-validation-engine
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:-}
      - AUDIT_LOGS_TOKEN=${AUDIT_LOGS_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
